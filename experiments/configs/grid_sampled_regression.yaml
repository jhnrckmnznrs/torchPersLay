data:
  diagram_dir: data/structures90
  targets_csv: data/targets90.csv

model:
  model_type: perslay_image
  feature_map_type: grid_sampled
  image_size: [15, 15]
  image_bnds: auto
  bounds_padding_fraction: 0.0

  sigma_x: auto
  sigma_y: auto
  sigma_multiplier: 1.0
  learnable_sigma: true

  # Matched to integrated_regression.yaml except for pixel discretization.
  normalize: true
  flatten_order: row-major
  weight_type: normalized_learnable_power

  hidden_dim: 64

training:
  batch_size: 2
  epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  resume_from: null
  resume_optimizer: false

output:
  run_dir: outputs/grid_sampled_normalized_regression
