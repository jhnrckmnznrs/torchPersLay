data:
  diagram_dir: data/structures90
  targets_csv: data/targets90.csv

model:
  image_size: [20, 20]
  image_bnds: auto
  bounds_padding_fraction: 0.05
  sigma_x: auto
  sigma_y: auto
  sigma_multiplier: 1.25
  hidden_dim: 128
  weight_type: normalized_learnable_power

training:
  batch_size: 2
  epochs: 150
  learning_rate: 0.00002
  weight_decay: 0.001
  num_workers: 4
  resume_from: null
  resume_optimizer: false
 
output:
  run_dir: outputs/degree2_regression
