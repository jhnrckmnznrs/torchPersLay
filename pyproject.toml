[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchPersLay"
version = "0.1.5"
description = "A native PyTorch implementation of PersLay for persistence diagrams."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "John Rick Dolor Manzanares" }
]
keywords = [
  "pytorch",
  "perslay",
  "persistence diagrams",
  "topological data analysis",
  "tda"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy",
  "torch",
]

[project.optional-dependencies]
experiments = [
  "pyyaml",
]

[project.urls]
Homepage = "https://github.com/jhnrckmnznrs/torchPersLay"
Repository = "https://github.com/jhnrckmnznrs/torchPersLay"
Issues = "https://github.com/jhnrckmnznrs/torchPersLay/issues"

[tool.setuptools.packages.find]
where = ["src"]
